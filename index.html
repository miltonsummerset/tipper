<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Swing App</title>
    <!-- CheerpJ Loader Skript -->
    <script src="https://cjrtnc.leaningtech.com/3.0/cj3load.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        async function startApp() {
            // Initialisierung für CheerpJ 3.0
            await cheerpjInit();
            cheerpjCreateDisplay(window.innerWidth, window.innerHeight, document.getElementById("container"));
            
            // Starte deine JAR-Datei (Dateiname EXAKT anpassen!)
            await cheerpjRunJar("/app/TipperGUI.jar");
        }

        // Sicherstellen, dass das CheerpJ-Skript vollständig geladen ist
        if (typeof cheerpjInit === "function") {
            startApp();
        } else {
            window.addEventListener("load", startApp);
        }
    </script>
</body>
</html>
