<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipper App</title>
    <!-- CheerpJ 3.0 Loader -->
    <script src="https://cjrtnc.leaningtech.com/3.0b/cj3load.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        async function runCheerpJ() {
            // Warten, bis cheerpjInit im Fenster verfügbar ist
            while (typeof cheerpjInit === "undefined") {
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            // CheerpJ initialisieren
            await cheerpjInit();
            cheerpjCreateDisplay(window.innerWidth, window.innerHeight, document.getElementById("container"));
            
            // Hauptklasse ausführen
            await cheerpjRunMain("main.TipperMain", "/app/TipperGUI.jar");
        }

        // Starten, sobald die Seite geladen ist
        window.addEventListener("load", runCheerpJ);
    </script>
</body>
</html>
